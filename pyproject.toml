[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "philo-mcts"
version = "0.1.0"
description = "Feasibility experiments for surprise-guided philosophical reasoning"
requires-python = ">=3.9"
dependencies = [
  "accelerate>=0.26",
  "torch>=2.1",
  "transformers>=4.46",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
philo-phase1 = "philo_mcts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

